[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wuwa-pull-planner-core"
version = "0.1.0"
description = "Exact endpoint optimizer for Wuthering Waves team and pull planning"
license = {text = "MIT"}
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
